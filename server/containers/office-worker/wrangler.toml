name = "filekit-office-worker-canary"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[observability]
enabled = true

[[r2_buckets]]
binding = "CANARY_BUCKET"
bucket_name = "filekit-canary-r2-staged"

[[containers]]
class_name = "OfficeWorker"
image = "./Dockerfile"

[[durable_objects.bindings]]
name = "OFFICE_WORKER"
class_name = "OfficeWorker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OfficeWorker"]
