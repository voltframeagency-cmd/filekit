name = "filekit-office-worker-canary"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[observability]
enabled = true

[[r2_buckets]]
binding = "CANARY_BUCKET"
bucket_name = "filekit-canary-r2-staged"

[[containers]]
class_name = "OfficeWorker"
image = "./Dockerfile"

[[durable_objects.bindings]]
name = "OFFICE_WORKER"
class_name = "OfficeWorker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OfficeWorker"]

[vars]
CANARY_FAULT_INJECTION_ENABLED = "false"

[env.production]
name = "filekit-office-worker-prod"

[[env.production.r2_buckets]]
binding = "CANARY_BUCKET"
bucket_name = "filekit-canary-r2-staged"

[[env.production.containers]]
class_name = "OfficeWorker"
image = "./Dockerfile"

[[env.production.durable_objects.bindings]]
name = "OFFICE_WORKER"
class_name = "OfficeWorker"

[env.production.vars]
CANARY_FAULT_INJECTION_ENABLED = "false"

[version_metadata]
binding = "CF_VERSION_METADATA"

[secrets]
required = [
  "CANARY_BEARER_TOKEN",
  "CANARY_ADMIN_SECRET"
]

