name = "filekit-staging"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "dist-staging"

[[d1_databases]]
binding = "DB"
database_name = "filekit-billing-d1"
database_id = "682e90a1-f70f-41a4-a60c-ecc928c9f057"

[vars]
ENVIRONMENT = "staging"
TAX_TREATMENT_DEFAULT = "INCLUSIVE"
TAX_RATE_PERCENT_DEFAULT = "25.0"
DEFAULT_TAX_JURISDICTION = "SE"

[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "filekit-billing-prod"
database_id = "c8890d8e-4632-453c-9a1d-102a0bff0e14"

[env.production.vars]
ENVIRONMENT = "production"
TAX_TREATMENT_DEFAULT = "INCLUSIVE"
TAX_RATE_PERCENT_DEFAULT = "25.0"
DEFAULT_TAX_JURISDICTION = "SE"
