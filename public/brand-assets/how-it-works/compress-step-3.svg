<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 451.97 330.33">
    <defs>
        <style>
            .bg-canvas{fill:#eff6ff;}
            .card-white{fill:#ffffff;filter:url(#drop-shadow-1);}
            .panel-bg{fill:#ffffff;stroke:#e2e8f0;stroke-width:1;}
            .img-card{fill:#f4f8ff;stroke:#dbeafe;stroke-width:1;}
            .sun{fill:#bfdbfe;}
            .cloud{fill:#e2e8f0;}
            .mtn-back{fill:#dbeafe;}
            .mtn-front{fill:#bfdbfe;}
            .tree{fill:#60a5fa;}
            .river-bg{fill:#93c5fd;}
            .river-stream{fill:#eff6ff;}
            .accent-blue{stroke:#2563eb;}
            .accent-blue-fill{fill:#2563eb;}
            .track-inactive{stroke:#dbeafe;}
            .dot-inactive{fill:#bfdbfe;}
        </style>
        <filter id="drop-shadow-1" x="20.61" y="11.57" width="450" height="337" filterUnits="userSpaceOnUse">
            <feOffset dx="-7.13" dy="-3.56" />
            <feGaussianBlur result="blur" stdDeviation="7.13" />
            <feFlood flood-color="#1e40af" flood-opacity=".08" />
            <feComposite in2="blur" operator="in" />
            <feComposite in="SourceGraphic" />
        </filter>
    </defs>
