    </g><text x="96" y="48" class="inter" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start" letter-spacing="0">File</text><text x="147.52" y="48" class="inter" font-size="28" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="0">Kit</text><text x="250" y="45" class="inter" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start" letter-spacing="0">All Tools</text><text x="330" y="45" class="inter" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="0">Compress</text><text x="420" y="45" class="inter" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start" letter-spacing="0">Convert</text><text x="500" y="45" class="inter" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start" letter-spacing="0">Merge</text><text x="565" y="45" class="inter" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start" letter-spacing="0">Image</text><text x="635" y="45" class="inter" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start" letter-spacing="0">Organize</text><rect x="875" y="18" width="270" height="38" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="898.72" cy="35.72" r="4.48" fill="none" stroke="#475569" stroke-width="1.6"/><line x1="902.08" y1="39.08" x2="906.72" y2="43.72" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/><text x="918" y="43" class="inter" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" letter-spacing="0">Search tools...</text><rect x="1111" y="24" width="24" height="26" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><text x="1123" y="42" class="inter" font-size="13" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0">/</text><circle cx="1185.5" cy="36.5" r="7.14" fill="none" stroke="#475569" stroke-width="1.5"/><path d="M1185.5 29.36 C1182.44 32.59,1182.44 40.41,1185.5 43.64" fill="none" stroke="#475569" stroke-width="1.2"/><path d="M1185.5 29.36 C1188.56 32.59,1188.56 40.41,1185.5 43.64" fill="none" stroke="#475569" stroke-width="1.2"/><line x1="1178.7" y1="36.5" x2="1192.3" y2="36.5" stroke="#475569" stroke-width="1.2"/><text x="1201" y="43" class="inter" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start" letter-spacing="0">English</text><path d="M1274 35 L1278.0 39.0 L1282 35" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1302" y="18" width="102" height="38" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="1353.0" y="42.0" class="inter" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle" letter-spacing="0">All tools</text><text x="120" y="100" class="inter" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" letter-spacing="0">Home</text><text x="160" y="100" class="inter" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" letter-spacing="0">›</text><text x="180" y="100" class="inter" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="0">Compress PDF</text><text x="300" y="154" class="inter" font-size="38" font-weight="700" fill="#0F172A" text-anchor="start" letter-spacing="0">Compress PDF below 2 MB</text><text x="300" y="184" class="inter" font-size="15" font-weight="400" fill="#475569" text-anchor="start" letter-spacing="0">This file requires temporary server processing.</text><rect x="1020" y="130" width="227.8" height="36" rx="9" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/><path d="M1035.16 152.48 H1043.16 C1046.36 152.48,1046.68 147.52,1043.48 146.88 C1042.52 142.4,1036.44 142.08,1035.0 146.24 C1031.64 146.72,1031.64 151.68,1035.16 152.48 Z" fill="none" stroke="#4F46E5" stroke-width="1.28" stroke-linejoin="round"/><text x="1054" y="153" class="inter" font-size="13" font-weight="700" fill="#4F46E5" text-anchor="start" letter-spacing="0">Secure temporary processing</text><rect x="300" y="225" width="840" height="505" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/><path d="M390.0 278.5 L416.6 287.6 V310.0 C416.6 326.8,405.4 338.0,390.0 343.6 C374.6 338.0,363.4 326.8,363.4 310.0 V287.6 Z" fill="none" stroke="#4F46E5" stroke-width="4.9" stroke-linejoin="round"/><text x="450" y="288" class="inter" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start" letter-spacing="0">Secure temporary processing required</text><text x="450" y="320" class="inter" font-size="14" font-weight="400" fill="#475569" text-anchor="start"><tspan x="450" dy="0">FileKit cannot safely complete this operation in your current browser.</tspan><tspan x="450" dy="20.3">Nothing will be uploaded until you explicitly continue.</tspan></text><rect x="335" y="380" width="770" height="238" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/><circle cx="372.0" cy="415.0" r="10.8" fill="#4F46E5"/><path d="M366.72 415.48 L370.56 419.32 L377.52 411.16" fill="none" stroke="#FFFFFF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="418" class="inter" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" letter-spacing="0">Encrypted in transit using TLS</text><text x="398" y="440" class="inter" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" letter-spacing="0">Your file is protected during transfer.</text><circle cx="372.0" cy="467.0" r="10.8" fill="#4F46E5"/><path d="M366.72 467.48 L370.56 471.32 L377.52 463.16" fill="none" stroke="#FFFFFF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="470" class="inter" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" letter-spacing="0">Processed in an isolated environment</text><text x="398" y="492" class="inter" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" letter-spacing="0">The worker is separated from public access.</text><circle cx="372.0" cy="519.0" r="10.8" fill="#4F46E5"/><path d="M366.72 519.48 L370.56 523.32 L377.52 515.16" fill="none" stroke="#FFFFFF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="522" class="inter" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" letter-spacing="0">Source deleted shortly after processing</text><text x="398" y="544" class="inter" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" letter-spacing="0">The original file is not retained.</text><circle cx="372.0" cy="571.0" r="10.8" fill="#4F46E5"/><path d="M366.72 571.48 L370.56 575.32 L377.52 567.16" fill="none" stroke="#FFFFFF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="574" class="inter" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" letter-spacing="0">Output expires automatically within 24 hours</text><text x="398" y="596" class="inter" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" letter-spacing="0">Download it before the expiry time.</text><rect x="335" y="650" width="280" height="52" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="475.0" y="681.0" class="inter" font-size="15" font-weight="700" fill="#4F46E5" text-anchor="middle" letter-spacing="0">Cancel</text><rect x="635" y="650" width="470" height="52" rx="10" fill="#4F46E5"/><text x="870.0" y="681.0" class="inter" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Continue with Server Processing</text><text x="720" y="758" class="inter" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" letter-spacing="0">By continuing, you consent to temporary processing under the Privacy Policy.</text><rect x="300" y="805" width="840" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><path d="M332.28 849.84 H346.28 C351.88 849.84,352.44 841.16,346.84 840.04 C345.16 832.2,334.52 831.64,332.0 838.92 C326.12 839.76,326.12 848.44,332.28 849.84 Z" fill="none" stroke="#4F46E5" stroke-width="2.24" stroke-linejoin="round"/><text x="370" y="834" class="inter" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" letter-spacing="0">Server routing is shown before transfer.</text><text x="370" y="857" class="inter" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" letter-spacing="0">FileKit never silently changes from local to server processing.</text></svg>